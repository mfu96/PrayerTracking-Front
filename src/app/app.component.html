<ion-app>
  <ion-split-pane contentId="main-content">
    <!-- Yan Menü -->
    <ion-menu contentId="main-content" type="overlay">

      <ion-content>
        <ion-list-header>
          Cami İşleri
        </ion-list-header>
        
        
          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
            <ion-item routerDirection="root" [routerLink]="p.url" routerLinkActive="selected" detail="false">
              <ion-icon slot="start" [name]="p.icon + '-outline'"></ion-icon>
              <ion-label>
                {{ p.title }}
              </ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-list-header>
            Account
          </ion-list-header>

          <ion-menu-toggle autoHide="false">
            <ion-item routerLink="/account" routerLinkActive="active" routerDirection="root" detail="false">
              <ion-icon slot="start" name="person"></ion-icon>
              <ion-label>
                Account
              </ion-label>
            </ion-item>
          </ion-menu-toggle>
        

          
      </ion-content>
    </ion-menu>
      <ion-router-outlet id="main-content"></ion-router-outlet>

   
  </ion-split-pane>
</ion-app>
